<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <title>時間軸</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script src="/ffxiv/timeline.js"></script>
</head>

<body>
    <div class="controls">
        <div style="font-weight: bold; color: #f39c12;">時間軸</div>
        <div class="zoom-control">
            <label>顯示比例 (拉寬/拉窄):</label>
            <input type="range" id="zoomRange" min="2" max="30" value="8">
            <span id="zoomVal">8px/s</span>
        </div>
        <div style="margin-left: auto;">
            <select id="select-raid">
                <option></option>
                <option value="t7s"> 　　T7S　　 | 巴哈姆特零式大迷宮 入侵之章2</option>
                <option value="t7s_min_ilvl"> T7S (min ilvl) | 巴哈姆特零式大迷宮 入侵之章2 (最低品級)</option>
                <option value="t8s"> 　　T8S　　 | 巴哈姆特零式大迷宮 入侵之章3</option>
            </select>
        </div>

    </div>

    <div id="main-container">
        <div id="notesContainer" class="notes-container"></div>
        <div id="timelineContainer">
            <div class="master-axis" id="masterAxis"></div>
            <div id="tracksArea"></div>
        </div>
    </div>

    <script>
        let unit = 8; // 預設 1秒 = 8px
        const tracksArea = document.getElementById('tracksArea');
        const masterAxis = document.getElementById('masterAxis');
        const zoomRange = document.getElementById('zoomRange');
        const zoomVal = document.getElementById('zoomVal');
        let rawData;
        let trackOffsets;

        $('#select-raid').select2({
            placeholder: "請選擇關卡",
            theme: "select2-adsht",
            width: 500
        });
        $('#select-raid').on('change', function (e) {
            loadTimeline('json/' + $(this).val() + '.json');
            window.history.pushState({}, '', '?raid=' + $(this).val());
        })

        const queryString = window.location.search;
        const urlParams = new URLSearchParams(queryString);
        const raid = urlParams.get('raid');
        if (raid) {
            $('#select-raid').val(raid).trigger('change');
        }
    </script>

    <style>
        #main-container {
            margin-top: 80px;
        }

        #notesContainer {
            user-select: text;
        }

        body {
            font-family: "Segoe UI", sans-serif;
            background: #121212;
            color: #e0e0e0;
            padding: 20px;
            user-select: none;
            margin: 0;
        }

        .controls {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: #222;
            display: flex;
            align-items: center;
            padding: 0 20px;
            z-index: 1000;
            border-bottom: 1px solid #444;
            gap: 20px;
        }

        .zoom-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #timelineContainer {
            position: relative;
            padding-bottom: 100px;
            min-height: 800px;
        }

        .master-axis {
            position: sticky;
            top: 60px;
            height: 50px;
            border-bottom: 2px solid #f39c12;
            background: #121212;
            z-index: 500;
            display: flex;
        }

        .tick {
            position: absolute;
            border-left: 1px solid #333;
            height: 15px;
            font-size: 11px;
            padding-left: 3px;
            color: #888;
        }

        .tick.major {
            border-left: 1px solid #666;
            height: 25px;
            color: #f39c12;
            font-weight: bold;
        }

        .track-loop {
            background: rgba(255, 255, 255, 0.03);
            pointer-events: none;
        }

        .track-phase {
            background: rgb(48 48 48);
        }

        .track {
            position: absolute;
            height: 130px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #333;
            white-space: nowrap;
        }

        .track:active {
            cursor: grabbing;
            background: rgba(255, 255, 255, 0.07);
            border-color: #f39c12;
        }

        .track-header {
            position: absolute;
            background: #333;
            padding: 5px 12px;
            border-radius: 4px;
            font-weight: bold;
            width: fit-content;
            border: 1px solid #555;
            font-size: 14px;
            top: -31px;
            pointer-events: auto;
        }

        .event {
            position: absolute;
            top: 10px;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: auto;
        }

        .event:hover {
            z-index: 9999;
        }

        .event .line {
            width: 2px;
            height: 40px;
        }

        .event .line-short {
            width: 2px;
            height: 5px;
        }

        .event .name {
            font-size: 12px;
            margin-top: 10px;
            color: #fff;
            background: rgba(0, 0, 0, 0.6);
            padding: 2px 4px;
            border-radius: 3px;
        }

        .event .tips {
            position: absolute;
            font-size: 12px;
            margin-top: 25px;
            color: #fff;
            background: rgba(0, 0, 0, 0.6);
            padding: 2px 4px;
            border-radius: 3px;
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
        }

        .event:hover .tips {
            opacity: 1;
        }

        .event .abs-time {
            font-size: 11px;
            color: #ffcc00;
            font-family: monospace;
            margin-top: 2px;
            font-weight: bold;
        }

        .event .rel-time {
            font-size: 10px;
            color: #777;
            margin-bottom: 2px;
        }

        .offset-hint {
            font-size: 11px;
            color: #aaa;
            margin-left: 10px;
            font-weight: normal;
        }

        .notes-container {
            margin-bottom: 20px;
            padding: 12px 16px;
            border: 1px solid #444;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.04);
            color: #ddd;
            line-height: 1.6;
            font-size: 14px;
            min-height: 48px;
            white-space: pre-wrap;
        }

        .notes-container .notes-label {
            font-weight: bold;
            color: #f39c12;
            margin-bottom: 6px;
            display: block;
        }

        .select2-container--select2-adsht .select2-selection--single {
            background-color: #555;
            border: 1px solid #555;
            border-radius: 4px;
            outline: 0
        }

        .select2-container--select2-adsht .select2-selection--single:focus {
            border: 1px solid #162235
        }

        .select2-container--select2-adsht .select2-selection--single .select2-selection__rendered {
            color: #f5f5f5;
            line-height: 28px
        }

        .select2-container--select2-adsht .select2-selection--single .select2-selection__clear {
            cursor: pointer;
            float: right;
            font-weight: bold;
            height: 26px;
            margin-right: 20px
        }

        .select2-container--select2-adsht .select2-selection--single .select2-selection__placeholder {
            color: #999
        }

        .select2-container--select2-adsht .select2-selection--single .select2-selection__arrow {
            background-color: #555;
            border: none;
            border-left: 1px solid #555;
            border-top-right-radius: 4px;
            border-bottom-right-radius: 4px;
            height: 26px;
            position: absolute;
            top: 1px;
            right: 1px;
            width: 20px
        }

        .select2-container--select2-adsht .select2-selection--single .select2-selection__arrow b {
            border-color: #888 transparent transparent transparent;
            border-style: solid;
            border-width: 5px 4px 0 4px;
            height: 0;
            left: 50%;
            margin-left: -4px;
            margin-top: -2px;
            position: absolute;
            top: 50%;
            width: 0
        }

        .select2-container--select2-adsht[dir="rtl"] .select2-selection--single .select2-selection__clear {
            float: left
        }

        .select2-container--select2-adsht[dir="rtl"] .select2-selection--single .select2-selection__arrow {
            border: none;
            border-right: 1px solid #555;
            border-radius: 0;
            border-top-left-radius: 4px;
            border-bottom-left-radius: 4px;
            left: 1px;
            right: auto
        }

        .select2-container--select2-adsht.select2-container--open .select2-selection--single {
            border: 1px solid #162235
        }

        .select2-container--select2-adsht.select2-container--open .select2-selection--single .select2-selection__arrow {
            background: transparent;
            border: none
        }

        .select2-container--select2-adsht.select2-container--open .select2-selection--single .select2-selection__arrow b {
            border-color: transparent transparent #888 transparent;
            border-width: 0 4px 5px 4px
        }

        .select2-container--select2-adsht.select2-container--open.select2-container--above .select2-selection--single {
            border-top: none;
            border-top-left-radius: 0;
            border-top-right-radius: 0
        }

        .select2-container--select2-adsht.select2-container--open.select2-container--below .select2-selection--single {
            border-bottom: none;
            border-bottom-left-radius: 0;
            border-bottom-right-radius: 0
        }

        .select2-container--select2-adsht .select2-selection--multiple {
            background-color: #555;
            border: 1px solid #555;
            border-radius: 4px;
            cursor: text;
            outline: 0;
            padding-bottom: 5px;
            padding-right: 5px
        }

        .select2-container--select2-adsht .select2-selection--multiple:focus {
            border: 1px solid #162235
        }

        .select2-container--select2-adsht .select2-selection--multiple .select2-selection__clear {
            display: none
        }

        .select2-container--select2-adsht .select2-selection--multiple .select2-selection__choice {
            background-color: #f39c12;
            border: 1px solid #555;
            border-radius: 4px;
            display: inline-block;
            margin-left: 5px;
            margin-top: 5px;
            padding: 0
        }

        .select2-container--select2-adsht .select2-selection--multiple .select2-selection__choice__display {
            cursor: default;
            padding-left: 2px;
            padding-right: 5px
        }

        .select2-container--select2-adsht .select2-selection--multiple .select2-selection__choice__remove {
            background-color: transparent;
            border: none;
            border-top-left-radius: 4px;
            border-bottom-left-radius: 4px;
            color: #888;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            padding: 0 4px
        }

        .select2-container--select2-adsht .select2-selection--multiple .select2-selection__choice__remove:hover {
            color: #555;
            outline: none
        }

        .select2-container--select2-adsht[dir="rtl"] .select2-selection--multiple .select2-selection__choice {
            margin-left: 5px;
            margin-right: auto
        }

        .select2-container--select2-adsht[dir="rtl"] .select2-selection--multiple .select2-selection__choice__display {
            padding-left: 5px;
            padding-right: 2px
        }

        .select2-container--select2-adsht[dir="rtl"] .select2-selection--multiple .select2-selection__choice__remove {
            border-top-left-radius: 0;
            border-bottom-left-radius: 0;
            border-top-right-radius: 4px;
            border-bottom-right-radius: 4px
        }

        .select2-container--select2-adsht.select2-container--open .select2-selection--multiple {
            border: 1px solid #162235
        }

        .select2-container--select2-adsht.select2-container--open.select2-container--above .select2-selection--multiple {
            border-top: none;
            border-top-left-radius: 0;
            border-top-right-radius: 0
        }

        .select2-container--select2-adsht.select2-container--open.select2-container--below .select2-selection--multiple {
            border-bottom: none;
            border-bottom-left-radius: 0;
            border-bottom-right-radius: 0
        }

        .select2-container--select2-adsht .select2-search--dropdown .select2-search__field {
            border: 1px solid #555;
            outline: 0
        }

        .select2-container--select2-adsht .select2-search--inline .select2-search__field {
            outline: 0;
            box-shadow: none;
            height: 1.5rem;
            padding-left: 2px
        }

        .select2-container--select2-adsht .select2-dropdown {
            background-color: #555;
            border: 1px solid transparent
        }

        .select2-container--select2-adsht .select2-dropdown--above {
            border-bottom: none
        }

        .select2-container--select2-adsht .select2-dropdown--below {
            border-top: none
        }

        .select2-container--select2-adsht .select2-results>.select2-results__options {
            max-height: 200px;
            overflow-y: auto;
            padding-bottom: 5px
        }

        .select2-container--select2-adsht .select2-results__option--group {
            padding: 0
        }

        .select2-container--select2-adsht .select2-results__option--disabled {
            color: #b92632;
            background-color: red
        }

        .select2-container--select2-adsht .select2-results__option--highlighted,
        .select2-container--select2-adsht .select2-results__option--highlighted .select2-results__option--selectable {
            background-color: #f39c12;
            color: #f5f5f5;
            margin-left: 5px;
            margin-right: 5px
        }

        .select2-container--select2-adsht .select2-results__option {
            margin-left: 5px;
            margin-right: 5px
        }

        .select2-container--select2-adsht .select2-results__group {
            cursor: default;
            display: block;
            padding: 6px;
            margin-left: 25%
        }

        .select2-container--select2-adsht.select2-container--open .select2-dropdown {
            border-color: #162235
        }
    </style>
</body>

</html>
