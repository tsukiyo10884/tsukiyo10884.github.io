<script>
    // 取得本地json(測試資料)
    const LoadLocalJson = (filePath, no) => {
        $.getJSON(filePath, (json) => {
            window.postMessage({ type: "collection", payload: json }, '*');
        });
    };
    $('extra').html(createCreditSection());
    let detailData = null;
    // 接到message事件(從maimai-net收到資料)
    $(window).on('message', (event) => {
        $('.test').hide();
        const data = event.originalEvent.data;
        if (data.type === 'init') {
            $('#msg').text('連線中，請勿關閉maimai-net...');
        }
        else if (data.type == "collection") {
            $('#tmp').hide();
            $('#collection').removeClass('d-none');
            showCollection(data.payload);
        }
    });
</script>
