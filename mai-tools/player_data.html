<body>
    <div class="main mb-5">
        <h3>施工中</h3>
        <div id="div-msg" class="col-12 d-flex align-items-center my-3">
            <div class="section-divider left"></div>
            <b id="msg" class="px-3 section-divider-title">如果你看到這行字超過5秒，代表資料沒傳成功，請回maimai-net重整後再試一次</b>
            <div class="section-divider right"></div>
        </div>
        <button id="test1" class="test"
            onclick="LoadLocalJson('json/test_data/test_data_player_data.json')">測試資料1</button>
        <div class="result-container my-4 d-none">
            <div id="classHTML" class="d-flex justify-content-center"></div>
            <div>
                <label>目標 Class：
                    <select id="targetClass"></select>
                </label>
                <label>所需CP：
                    <input type="number" id="requiredCP" readonly />
                </label>
            </div>
            <div id="classRule"></div>
        </div>
    </div>
    <footer class="text-center">
        <hr>
        Made by <a href="https://github.com/tsukiyo10884/" target="_blank">Tsukiyo</a>, in collaboration with <a
            href="https://www.instagram.com/mua_2110/" target="_blank">Ayo</a> and <a
            href="https://www.instagram.com/aaaaaaaaaxiuan/" target="_blank">Axuan</a>.
    </footer>
    <div class="extra-credits"></div>
</body>

<script>
    let detailData = null;
    let currentClass = "";
    let currentCP = 0;

    // 取得本地json(測試資料)
    const LoadLocalJson = (filePath) => {
        $.getJSON(filePath, (json) => {
            window.postMessage({ type: "playerData", payload: json }, '*');
        });
    };

    // 接到message事件(從maimai-net收到資料)
    $(window).on('message', (event) => {
        $('.test').addClass('d-none');
        const data = event.originalEvent.data;
        if (data.type === 'init') {
            $('#msg').text('連線中，請勿關閉maimai-net...');
        }
        else if (data.type === 'playerData') {
            $('.result-container').removeClass('d-none');
            $('#div-msg').addClass('d-none');
            const playerData = data.payload;
            showClassProgress(playerData);
            currentClass = getClassRank(playerData.text);
            currentCP = playerData.point;

            // 建立下拉(過濾id低於現在階級id的選項) 
            const $targetSelect = $('#targetClass');
            classes.forEach(c => {
                if (c.id > classes.find(cls => cls.name === currentClass).id) {
                    let opt = $('<option></option>').val(c.name).text(c.name);
                    $targetSelect.append(opt);
                }
            });
            countRequiredPoints(currentClass, currentCP, $targetSelect.val());
            $targetSelect.on('change', function () {
                countRequiredPoints(currentClass, currentCP, this.value);
            });
        }
    });



</script>
