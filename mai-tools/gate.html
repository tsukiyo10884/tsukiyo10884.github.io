<body>
    <div class="main mb-5">
        <div class="result-container">
            <div id="gate" class="align-items-center mb-4">
                <div class="col-12 d-flex align-items-center my-3">
                    <div class="section-divider left"></div>
                    <b id="msg" class="px-3 section-divider-title">如果看到這行字超過5秒，代表資料沒傳成功，請回maimai-net重整後再試一次</b>
                    <div class="section-divider right"></div>
                </div>
                <button id="test1" class="test" onclick="LoadLocalJson('json/test_data/test_data_gate1.json',1)">測試資料1</button>
                <button id="test7" class="test" onclick="LoadLocalJson('json/test_data/test_data_gate7.json',7)">測試資料7</button>
                <button id="test7" class="test" onclick="LoadLocalJson('json/test_data/test_data_gate9.json',9)">測試資料9</button>
                <button id="test7" class="test" onclick="LoadLocalJson('json/test_data/test_data_gate10.json',10)">測試資料10</button>
            </div>
            <div id="map" class="w-100 mb-4"></div>
            <div id="song-table" class="ms-1 mt-1"></div>
        </div>
    </div>
    <footer class="text-center">
        <hr>
        Made by <a href="https://github.com/tsukiyo10884/" target="_blank">Tsukiyo</a>, in collaboration with <a
            href="https://www.instagram.com/mua_2110/" target="_blank">Ayo</a> and <a
            href="https://www.instagram.com/aaaaaaaaaxiuan/" target="_blank">Axuan</a>.
    </footer>
    <div class="extra-credits"></div>
</body>

<script>
    // 取得本地json(測試資料)
    const LoadLocalJson = (filePath, no) => {
        $.getJSON(filePath, (json) => {
            window.postMessage({ type: "gate" + no, payload: json }, '*');
        });
    };
    $('extra').html(createCreditSection());
    let detailData = null;
    // 接到message事件(從maimai-net收到資料)
    $(window).on('message', (event) => {
        $('.test').hide();
        const data = event.originalEvent.data;
        if (data.type === 'init') {
            $('#msg').text('連線中，請勿關閉maimai-net...');
        }
        else if (data.type.includes('gate')){
            showGateData(data);
        }
    });
    $(window).on('load', async () => {
        detailData = await fetch('https://dp4p6x0xfi5o9.cloudfront.net/maimai/data.json')
            .then(res => res.json());
    });
</script>
