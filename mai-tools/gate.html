<!DOCTYPE html>
<html lang="zh-TW">
<svg width="0" height="0">
    <filter id="crayon-effect">
        <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G" />
    </filter>
</svg>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=915">
    <link rel="icon" href="img/favicon.ico">
    <title>maimai小工具</title>
    <link id="theme" rel="stylesheet" href="css/default.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
</head>

<body>
    <div class="main mb-5">
        <div class="result-container">
            <div id="gate" class="align-items-center mb-4">
                <div class="col-12 d-flex align-items-center my-3">
                    <div class="section-divider left"></div>
                    <b id="msg"
                        class="px-3 section-divider-title">連線中，請勿關閉maimai-net...(如過10秒無反應，請回maimai-net重整後再試一次)</b>
                    <div class="section-divider right"></div>
                </div>
            </div>
            <div id="map" class="w-100 mb-4"></div>
            <div id="song-table" class="ms-1 mt-1"></div>
        </div>
    </div>
</body>

<script>
    let detailData = null;
    let gateSongData = null;
    // 接到message事件(從maimai-net收到資料)
    $(window).on('message', (event) => {
        const data = event.originalEvent.data;
        if (data.type === 'gate1_init') {
            $('#msg').text('連線中，請勿關閉maimai-net...由於一次請求過多容易被鎖連線(說的就是你29首的青鑰匙)，此動作會相當緩慢...');
        }
        else if(data.type === 'init'){
            $('#msg').text('連線中，請勿關閉maimai-net...');
        }
        else if (data.type === 'gate1') {
            const gate1 = data.payload;
            const res = []
            gate1.keySongs.forEach(song => {
                const songEntry = detailData.songs.find(s => s.songId === song.title);
                const type = 'dx';
                const image = `https://dp4p6x0xfi5o9.cloudfront.net/maimai/img/cover/${songEntry?.imageName}`;
                const isCompleted = song.songLastPlayedDate > '2025-01-16'

                res.push(createSquareSongCard({
                    title: song.title,
                    type: type,
                    image: image
                }, {
                    isCompleted: isCompleted
                }));
            });

            const headerImg = gate1.headerImg ? `<div class="d-flex justify-content-center"><img src="${gate1.headerImg}" alt="Header Image"></div>` : '';
            $('#gate').html([headerImg, gate1.gateImgHTML].join(''));
            $('#song-table').html(`
                <div class="col-12 d-flex align-items-center my-3">
                    <div class="section-divider left"></div>
                        <b class="px-3 section-divider-title">Key</b>
                    <div class="section-divider right"></div>
                </div>
                <div class="d-flex justify-content-center mb-4 text-center">青鑰匙獲得條件：在青門開放後(國際版為2025/01/16)，打過以下所有曲子<br/>(任意難度、不限成績、可跳過，不可宴譜面、不可用段位認定模式)</div>
                <div id="level-song-grid" class="square-song-grid col-12 row ms-0">
                    ${res.join('')}
                </div>
            ` );
            $('#map').html([`
                <div class="col-12 d-flex align-items-center my-3">
                    <div class="section-divider left"></div>
                        <b class="px-3 section-divider-title">Gate</b>
                    <div class="section-divider right"></div>
                </div>
                <div class="d-flex justify-content-center mb-4">青門發現條件：走完「スカイストリートちほー6」</div>
            `, gate1.mapHTML].join(''));
        }
        else if (data.type === 'gate2'){
            const gate2 = data.payload;
            const res = []
            gate2.keySongs.forEach(song => {
                const songEntry = detailData.songs.find(s => s.songId === song.title);
                const type = 'dx';
                const image = `https://dp4p6x0xfi5o9.cloudfront.net/maimai/img/cover/${songEntry?.imageName}`;

                res.push(createSquareSongCard({
                    title: song.title,
                    type: type,
                    image: image
                }));
            });

            const headerImg = gate2.headerImg ? `<div class="d-flex justify-content-center"><img src="${gate2.headerImg}" alt="Header Image"></div>` : '';
            $('#gate').html([headerImg, gate2.gateImgHTML].join(''));
            $('#song-table').html(`
                <div class="col-12 d-flex align-items-center my-3">
                    <div class="section-divider left"></div>
                        <b class="px-3 section-divider-title">Key</b>
                    <div class="section-divider right"></div>
                </div>
                <div class="d-flex justify-content-center mb-4 text-center">白鑰匙獲得條件：一道內遊玩作曲家大國奏音的歌曲，該道內不可重複選曲，雙人時需遊玩4曲<br/>(任意難度、不限成績、可跳過，不可宴譜面、不可用段位認定模式)</div>
                <div id="level-song-grid" class="square-song-grid col-12 row ms-0">
                    ${res.join('')}
                </div>
            ` );
            $('#map').html([`
                <div class="col-12 d-flex align-items-center my-3">
                    <div class="section-divider left"></div>
                        <b class="px-3 section-divider-title">Gate</b>
                    <div class="section-divider right"></div>
                </div>
                <div class="d-flex justify-content-center mb-4">白門發現條件：走完「天界ちほー8」</div>
            `, gate2.mapHTML].join(''));

        }
        else if (data.type === 'gate3'){
            const gate3 = data.payload;
            const res = []
            gate3.keySongs.forEach(song => {
                const songEntry = detailData.songs.find(s => s.songId === song.title);
                const type = song.type;
                const image = `https://dp4p6x0xfi5o9.cloudfront.net/maimai/img/cover/${songEntry?.imageName}`;

                res.push(createSquareSongCard({
                    title: song.title,
                    type: type,
                    image: image
                }));
            });

            const headerImg = gate3.headerImg ? `<div class="d-flex justify-content-center"><img src="${gate3.headerImg}" alt="Header Image"></div>` : '';
            $('#gate').html([headerImg, gate3.gateImgHTML].join(''));
            $('#song-table').html(`
                <div class="col-12 d-flex align-items-center my-3">
                    <div class="section-divider left"></div>
                        <b class="px-3 section-divider-title">Key</b>
                    <div class="section-divider right"></div>
                </div>
                <div class="d-flex justify-content-center mb-4 text-center">紫鑰匙獲得條件：アウル（BLACK ROSEちほー)或アウル（BLACK ROSEちほー4)作為隊長，並在一道內遊玩黑薔薇或言葉系列歌曲，該道內不可重複選曲，雙人時需遊玩4曲<br/>(任意難度、不限成績、可跳過，不可宴譜面、不可用段位認定模式)</div>
                <div id="level-song-grid" class="square-song-grid col-12 row ms-0">
                    ${res.join('')}
                </div>
            ` );
            $('#map').html([`
                <div class="col-12 d-flex align-items-center my-3">
                    <div class="section-divider left"></div>
                        <b class="px-3 section-divider-title">Gate</b>
                    <div class="section-divider right"></div>
                </div>
                <div class="d-flex justify-content-center mb-4">紫門發現條件：走完「BLACK ROSEちほー10」</div>
            `, gate3.mapHTML].join(''));

        }
        else if (data.type === 'gate4') {
            const gate4 = data.payload;
            const res = []
            gate4.keySongs.forEach(song => {
                const songEntry = detailData.songs.find(s => s.songId === song.title);
                const type = song.type;
                const image = `https://dp4p6x0xfi5o9.cloudfront.net/maimai/img/cover/${songEntry?.imageName}`;
                const isCompleted = song.songLastPlayedDate > '2025-02-27'

                res.push(createSquareSongCard({
                    title: song.title,
                    type: 'dx',
                    image: image
                }, {
                    isCompleted: isCompleted
                }));
            });

            const headerImg = gate4.headerImg ? `<div class="d-flex justify-content-center"><img src="${gate4.headerImg}" alt="Header Image"></div>` : '';
            $('#gate').html([headerImg, gate4.gateImgHTML].join(''));
            $('#song-table').html(`
                <div class="col-12 d-flex align-items-center my-3">
                    <div class="section-divider left"></div>
                        <b class="px-3 section-divider-title">Key</b>
                    <div class="section-divider right"></div>
                </div>
                <div class="d-flex justify-content-center mb-4 text-center">黑鑰匙獲得條件：在黑門開放後(國際版為2025/02/27)，打過以下所有KOP(KING of Performai)曲子<br/>(任意難度、不限成績、可跳過，不可宴譜面、不可用段位認定模式)</div>
                <div id="level-song-grid" class="square-song-grid col-12 row ms-0">
                    ${res.join('')}
                </div>
            ` );
            $('#map').html([`
                <div class="col-12 d-flex align-items-center my-3">
                    <div class="section-divider left"></div>
                        <b class="px-3 section-divider-title">Gate</b>
                    <div class="section-divider right"></div>
                </div>
                <div class="d-flex justify-content-center mb-4">黑門發現條件：走完「メトロポリスちほー9」</div>
            `, gate4.mapHTML].join(''));
        }
    });
    $(window).on('load', async () => {
        detailData = await fetch('https://dp4p6x0xfi5o9.cloudfront.net/maimai/data.json')
            .then(res => res.json());
        gateSongData = await fetch('https://tsukiyo10884.github.io/mai-tools/json/gate.json')
            .then(res => res.json());
    });

    const createSquareSongCard = (song, {
        isCompleted = null,
    } = {}) => {
        return `
        <div class="square-song-card ${isCompleted === true ? 'completed' : ''} deg${Math.floor(Math.random() * 5)}" 
                onclick="showSongDetail('${song.title}', '${song.type}')">
            <img src=${song.image} class="square-song-image" alt="${song.title}">
            <div class="song-overlay"></div>
            <div class="square-song-info-block">
                <div class="song-content text-shadow-black square-song-title">${song.title}</div>
                <div class="song-content text-shadow-black square-song-inner-level"> ${song.type.toUpperCase()}</div>
                ${isCompleted === true ? '<div class="completion-check"><b>✓</b></div>' : ''}
                <div class="card-decoration"></div>
            </div>
        </div>`;

    }

    // 點選可跳轉到zetaraku
    const showSongDetail = (title, type) => {
        window.open(`https://arcade-songs.zetaraku.dev/maimai/?title=${title}&types=${type}`, '_blank');
    }
</script>

        --bs-gutter-x: 1.5rem;
        --bs-gutter-y: 0;

        margin-right: auto;
        padding-left: calc(var(--bs-gutter-x) * .5);
        padding-right: calc(var(--bs-gutter-x) * .5);
