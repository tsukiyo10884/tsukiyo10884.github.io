<!DOCTYPE html>
<html lang="zh-TW">
<svg width="0" height="0">
    <filter id="crayon-effect">
        <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G" />
    </filter>
</svg>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=915">
    <link rel="icon" href="img/favicon.ico">
    <title>maimai小工具-最近遊玩曲目</title>
    <link rel="stylesheet" href="css/record_beta.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
</head>

<body>
    <div class="main">
        <button id="btn-expand">&gt;</button>
        <nav class="side-panel" id="side-panel">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <span id="nav-title">最近遊玩曲目</span>
            </div>
            <div class="controls">
                <button id="btn-all" class="secondary-btn">全選</button>
                <button id="btn-clear" class="secondary-btn">清空選擇</button>
                <button id="btn-collapse" class="secondary-btn">隱藏側板</button>
            </div>
            <ul id="song-list">
            </ul>
        </nav>
        <div style="flex-direction: column; width: 100%;">
            <span id="body-title">曲目成績</span>
            <span id="body-subtitle">Records</span>

            <!-- From Uiverse.io by Bodyhc -->
            <span class="checkbox-wrapper-35 p-0">
                <input value="private" name="switch" id="toggle-notes-switch" type="checkbox" class="switch" checked>
                <label for="toggle-notes-switch" style="width: fit-content;">
                    <span class="switch-x-text"></span>
                    <span class="switch-x-toggletext">
                        <span class="switch-x-unchecked"><span class="switch-x-hiddenlabel">Unchecked: </span>隱藏詳細資料</span>
                        <span class="switch-x-checked"><span class="switch-x-hiddenlabel">Checked: </span>顯示詳細資料</span>
                    </span>
                </label>
            </span>

            <main id="display-board">
                <div class="empty-msg">請從左側選擇曲目進行並排比較</div>
            </main>
        </div>
    </div>
</body>

<script>
    let selectedTracks = [];
    let selectedIds = new Set();
    let detailData = null;
    let rawData = [];

    // 取得本地json(測試資料)
    const LoadLocalJson = (filePath) => {
        $.getJSON(filePath, (json) => {
            window.postMessage({ type: "record", payload: json }, '*');
        });
    };

    // 接到message事件(收到資料)
    $(window).on('message', async (event) => {
        $('.test').addClass('d-none');
        const data = event.originalEvent.data;
        if (data.type === 'record') {
            rawData = data.payload;
            init();
        }
    });

    const init = () => {
        renderSidebar();

        $('#song-list').on('change', '.song-checkbox-hidden', function () {
            const id = parseInt($(this).val());
            if (this.checked) {
                selectedIds.add(id);
            } else {
                selectedIds.delete(id);
            }
            renderBoard();
        });

        $('#btn-all').click(function () {
            selectedIds.clear();
            $('.song-checkbox-hidden').map(item => selectedIds.add(item));
            $('.song-checkbox-hidden').prop('checked', true);
            renderBoard();
        });
        $('#btn-clear').click(function () {
            selectedIds.clear();
            $('.song-checkbox-hidden').prop('checked', false);
            renderBoard();
        });
        $('#toggle-notes-switch').click(function () {
            $('#display-board').toggleClass('hide-notes');
            const isHidden = $('#display-board').hasClass('hide-notes');
            $(this).text(isHidden ? '顯示詳細數據' : '隱藏詳細數據');
        });

        $('#btn-collapse').click(function () {
            $('#side-panel').addClass('collapsed');
            $('#btn-expand').fadeIn(200);
        });

        $('#btn-expand').click(function () {
            $('#side-panel').removeClass('collapsed');
            $('#btn-expand').fadeOut(200);
        });

    }

    const renderSidebar = () => {
        const $list = $('#song-list');
        rawData.forEach(item => {
            $list.append(`
                <li class="song-item-wrapper">
                    <input type="checkbox" id="song-chk-${item.no}" class="song-checkbox-hidden" value="${item.no}">
                    <label for="song-chk-${item.no}" class="song-label">
                        <span class="label-status"></span>
                        <span class="label-title">${item.title}</span>
                        <span class="label-level">(${item.internalLevel})</span>
                    </label>
                </li>
            `);
        });
    }


    const renderBoard = () => {
        const $board = $('#display-board').empty();
        const filteredData = rawData.filter(item => selectedIds.has(item.no));

        if (filteredData.length === 0) {
            $board.append('<div style="color:#999">請由左側選取曲目</div>');
            return;
        }

        filteredData.forEach(item => {
            const n = item.notes;
            const types = ['tap', 'hold', 'slide', 'touch', 'break'];

            const cardHtml = `
                <div class="card ${item.difficulty}">
                    <div class="card-header">
                        <img class="card-image" src="${item.image}">
                        <div style="flex: 1; overflow: hidden;">
                            <div class="card-title">${item.title}</div>
                            <div class="meta-info">
                                <span class="badge diff-${item.difficulty}">${item.difficulty.toUpperCase()}</span>
                                <span class="badge level">${item.internalLevel}</span>
                            </div>
                            <div class="card-score">${item.score}</div>
                        </div>
                    </div>

                    <div class="card-body">
                        <table class="note-table">
                            <thead>
                                <tr>
                                    <th></th>
                                    <th class="note-header cp">CRITICAL</th>
                                    <th class="note-header p">PERFECT</th>
                                    <th class="note-header gr">GREAT</th>
                                    <th class="note-header gd">GOOD</th>
                                    <th class="note-header ms">MISS</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${types.map(type => {
                let str = ''
                if (type == 'touch' && n[type].critical_perfect == 0 && n[type].perfect == 0 && n[type].great == 0 && n[type].good == 0 && n[type].miss == 0) {
                    str = `
                                                <tr>
                                                    <td class="row-label">${type.toUpperCase()}</td>
                                                    <td></td>
                                                    <td></td>
                                                    <td></td>
                                                    <td></td>
                                                    <td></td>
                                                </tr>
                                            `;
                } else {
                    str = `
                                                <tr>
                                                    <td class="row-label">${type.toUpperCase()}</td>
                                                    <td style="${n[type].critical_perfect > 0 ? 'color:#f39c12; font-weight:bold' : 'color:#ccc'}">${n[type].critical_perfect || '0'}</td>
                                                    <td style="${n[type].perfect > 0 ? 'color:#f1c40f; font-weight:bold' : 'color:#ccc'}">${n[type].perfect || '0'}</td>
                                                    <td style="${n[type].great > 0 ? 'color:#ff6ffd; font-weight:bold' : 'color:#ccc'}">${n[type].great || '0'}</td>
                                                    <td style="${n[type].good > 0 ? 'color:#2ecc71; font-weight:bold' : 'color:#ccc'}">${n[type].good || '0'}</td>
                                                    <td style="${n[type].miss > 0 ? 'color:#e74c3c; font-weight:bold' : 'color:#ccc'}">${n[type].miss || '0'}</td>
                                                </tr>
                                            `;
                }
                return str;
            }).join('')}
                            </tbody>
                        </table>
                    </div>

                    <div class="card-bottom-info">
                        <span>FAST <b style="color:#34a3ff">${item.fast}</b></span>
                        <span>LATE <b style="color:#ff5b5b">${item.late}</b></span>
                        <span>Rating <b style="color:#ffffe0">${item.rating}</b></span>
                    </div>
                </div>
            `;
            $board.append(cardHtml);
        });
    }
</script>
