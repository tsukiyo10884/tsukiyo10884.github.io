<!DOCTYPE html>
<html lang="zh-TW">
<svg width="0" height="0">
    <filter id="crayon-effect">
        <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G" />
    </filter>
</svg>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=915">
    <link rel="icon" href="img/favicon.ico">
    <title>maimai小工具</title>
    <link id="theme" rel="stylesheet" href="css/default.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3"></script>
    <script src="js/common.js"></script>
    <script src="js/others/course.js"></script>

</head>

<body>
    <div class="main mb-5">
        <div id="level-stat" class="text-center">
            <h3>段位認定</h3>
            <h5>PRiSM PLUS</h5>
        </div>
        <img id="palette" src="img/palette.svg">
        <div id="div-msg" class="col-12 d-flex align-items-center my-3">
            <div class="section-divider left"></div>
            <b id="msg" class="px-3 section-divider-title">如果看到這行字超過5秒，代表資料沒傳成功，請回maimai-net重整後再試一次</b>
            <div class="section-divider right"></div>
        </div>
        <button id="test1" class="test" onclick="LoadLocalJson('json/test_data/test_data_course.json')">測試資料1</button>
        <div class="result-container my-4 d-none">

        </div>
    </div>
    <footer class="text-center">
        <hr>
        Made by <a href="https://github.com/tsukiyo10884/" target="_blank">Tsukiyo</a>, in collaboration with <a
            href="https://www.instagram.com/mua_2110/" target="_blank">Ayo</a> and <a
            href="https://www.instagram.com/aaaaaaaaaxiuan/" target="_blank">Axuan</a>.
    </footer>
    <div class="extra-credits"></div>
</body>

<script>
    initPalette();
    // 取得本地json(測試資料)
    const LoadLocalJson = (filePath) => {
        $.getJSON(filePath, (json) => {
            window.postMessage({ type: "course", payload: json }, '*');
        });
    };

    // 接到message事件(從maimai-net收到資料)
    $(window).on('message', async (event) => {
        $('.test').addClass('d-none');
        const data = event.originalEvent.data;
        if (data.type === 'init') {
            $('#msg').text('連線中，請勿關閉maimai-net...');
            if (data.payload != null) {
                if (cssFiles.includes('css/' + data.payload + '.css')) {
                    $('#theme').attr('href', 'css/' + data.payload + '.css');
                    $('#palette').attr('title', data.payload);
                } else {
                    $('#theme').attr('href', 'css/default.css');
                    $('#palette').attr('title', 'default');
                }
            }
        }
        else if (data.type === 'course') {
            $('.result-container').removeClass('d-none');
            $('#div-msg').addClass('d-none');
            showCourseList(data.payload);
        }

    });



</script>
<style>
    .main {
        --bs-gutter-x: 1.5rem;
        --bs-gutter-y: 0;
        margin-left: auto;
        margin-right: auto;
        padding-left: calc(var(--bs-gutter-x) * .5);
        padding-right: calc(var(--bs-gutter-x) * .5);
        width: 915px;
        position: relative;
    }

    #palette {
        position: absolute;
        top: 20px;
        right: 45px;
    }

    .f-20 {
        font-size: 20px;
    }

    .song-card {
        width: 216px;
    }

    .song-overlay {
        width: 215px;
    }
</style>
