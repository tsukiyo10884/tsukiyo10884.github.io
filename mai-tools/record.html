<!DOCTYPE html>
<html lang="zh-TW">
<svg width="0" height="0">
    <filter id="crayon-effect">
        <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G" />
    </filter>
</svg>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=915">
    <link rel="icon" href="img/favicon.ico">
    <title>maimai小工具</title>
    <link id="theme" rel="stylesheet" href="css/default.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

</head>

<body>
    <div class="main mb-5">
        <button id="test1" class="test" onclick="LoadLocalJson('json/test_data_record.json')">測試資料1</button>
        <div class="result-container my-4">
            <canvas id="ratingChart" height="100" class="my-4"></canvas>
            <div id="song-list" class="row g-3"></div>
        </div>
    </div>
    <footer class="text-center">
        <hr>
        Made by <a href="https://github.com/tsukiyo10884/" target="_blank">Tsukiyo</a>, in collaboration with <a
            href="https://www.instagram.com/mua_2110/" target="_blank">Ayo</a> and <a
            href="https://www.instagram.com/aaaaaaaaaxiuan/" target="_blank">Axuan</a>.
    </footer>
</body>

<script>
    // 取得本地json(測試資料)
    const LoadLocalJson = (filePath) => {
        $.getJSON(filePath, (json) => {
            $('.test').hide();
            window.postMessage({ type: "record", payload: json }, '*');
        });
    };
    let detailData = null;
    // 接到message事件(從maimai-net收到資料)
    $(window).on('message', (event) => {
        const data = event.originalEvent.data;
        if (data.type === 'init') {
            $('#msg').text('連線中，請勿關閉maimai-net...');
        }
        else if (data.type === 'record') {
            const recordData = data.payload;

            // R值折線圖
            const labels = [...recordData].reverse().map((song, i) => `${i + 1}. ${song.title}`);
            const ratings = [...recordData].reverse().map(song => parseInt(song.rating, 10));

            // 設定每個點的背景色，最後一個透明
            const pointColors = ratings.map((_, i) =>
                i === ratings.length - 1 ? 'white' : '#0b4670'
            );

            // 找出有變化的點，變化的半徑設 2，沒變化設 0
            const pointRadii = ratings.map((val, i, arr) =>
                i === 0 || val !== arr[i - 1] ? 2 : 0 || val !== arr[i + 1] ? 2 : 0
            );

            // 設定每個點的邊框色
            const pointBorders = ratings.map(() => '#0b4670');

            const ctx = document.getElementById('ratingChart').getContext('2d');

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Rating',
                        data: ratings,
                        borderColor: '#0b4670',
                        backgroundColor: '#0b4670',
                        fill: false,
                        tension: 0,
                        borderWidth: 1,
                        pointRadius: pointRadii,
                        pointBackgroundColor: pointColors,
                        pointBorderColor: pointBorders,
                        pointBorderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    layout: {
                        padding: {
                            left: 35,
                            right: 25
                        }
                    },
                    scales: {
                        x: { ticks: { display: false } },
                        y: { beginAtZero: false }
                    },
                    plugins: {
                        legend: {
                            display: false // 不顯示圖例
                        },
                        datalabels: {
                            formatter: (value, context) => {
                                return context.dataset.pointRadius[context.dataIndex] === 2 ? value : '';
                            },
                            anchor: (context) => {
                                const index = context.dataIndex;
                                const dataset = context.dataset;
                                const pointRadii = dataset.pointRadius;
                                const last = context.chart.$lastLabelPos || { pos: 'end' };

                                let pos;
                                if (pointRadii[index] === 2) {
                                    pos = last.pos === 'end' ? 'start' : 'end';
                                    context.chart.$lastLabelPos = { pos };
                                } else {
                                    pos = last.pos;
                                }
                                return pos;
                            },
                            align: (context) => {
                                const lastPos = context.chart.$lastLabelPos?.pos || 'end';
                                return context.dataset.pointRadius[context.dataIndex] === 2
                                    ? (lastPos === 'end' ? 'bottom' : 'top')
                                    : 'center';
                            }
                        }
                    }
                },
                plugins: [ChartDataLabels] // 啟用 datalabels 插件
            });

            // 設定背景色
            Chart.defaults.color = '#203844';
            ctx.canvas.style.backgroundColor = '#ffffff';


            // 歌曲詳細資料
            const $container = $("#song-list");

            $.each(recordData, function (_, song) {
                let notesTable = `
                <table class="mb-2">
                    <thead class="table-light">
                        <tr>
                            <th>Type</th>
                            <th>Critical Perfect</th>
                            <th>Perfect</th>
                            <th>Great</th>
                            <th>Good</th>
                            <th>Miss</th>
                        </tr>
                    </thead>
                    <tbody>
                `;

                $.each(song.notes, function (type, vals) {
                    notesTable += `
                    <tr>
                        <td>${type.charAt(0).toUpperCase() + type.slice(1)}</td>
                        <td>${vals.critical_perfect}</td>
                        <td>${vals.perfect}</td>
                        <td>${vals.great}</td>
                        <td>${vals.good}</td>
                        <td>${vals.miss}</td>
                    </tr>
                `;
                });

                notesTable += `</tbody></table>`;

                $container.append(`
                    <div class="col-2">
                        <div class="">
                        <img src="${song.image}" class="card-img-top" alt="${song.title}">
                        <div class="">
                            <h5 class="">${song.title}</h5>
                            <p class=""><strong>Score:</strong> ${song.score}</p>
                            <p class=""><strong>DX Score:</strong> ${song.dx_score}</p>
                            <p class=""><strong>FAST:</strong> ${song.fast} | <strong>LATE:</strong> ${song.late}</p>
                            <p class=""><strong>Rating:</strong> ${song.rating} ${song.rating_plus}</p>
                            ${notesTable}
                            <p class=""><strong>Max Combo:</strong> ${song.max_combo}</p>
                            <p class=""><strong>Max Sync:</strong> ${song.max_sync}</p>
                        </div>
                        </div>
                    </div>
                `);
            });
        }
    });

</script>
