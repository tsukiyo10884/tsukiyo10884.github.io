<!DOCTYPE html>
<html lang="zh-TW">
<svg width="0" height="0">
    <filter id="crayon-effect">
        <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G" />
    </filter>
</svg>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=915">
    <link rel="icon" href="img/favicon.ico">
    <title>maimai小工具</title>
    <link id="theme" rel="stylesheet" href="css/default.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3"></script>
    <script src="js/common.js"></script>

</head>

<body>
    <div class="main mb-5">
        <h3>施工中</h3>
        <div id="div-msg" class="col-12 d-flex align-items-center my-3">
            <div class="section-divider left"></div>
            <b id="msg" class="px-3 section-divider-title">如果你看到這行字超過5秒，代表資料沒傳成功，請回maimai-net重整後再試一次</b>
            <div class="section-divider right"></div>
        </div>
        <button id="test1" class="test" onclick="LoadLocalJson('json/test_data_record.json')">測試資料1</button>
        <div class="result-container my-4 d-none">
            <div id="div-rating-chart" class="mb-4">
                <div id="rating-chart-title" class="text-center mb-3">
                    <h5>近50首Rating變化</h5>
                </div>
                <div class="heavy-hr"></div>
                <canvas id="rating-chart" height="100" class="my-4"></canvas>
                <div class="heavy-hr"></div>
            </div>
            <table id="song-table" width="100%">
                <thead>
                    <tr>
                        <th>封面</th>
                        <th>曲名</th>
                        <th>成績</th>
                        <th>DX成績</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- 由JS產生 -->
                </tbody>
            </table>
        </div>
    </div>
    <footer class="text-center">
        <hr>
        Made by <a href="https://github.com/tsukiyo10884/" target="_blank">Tsukiyo</a>, in collaboration with <a
            href="https://www.instagram.com/mua_2110/" target="_blank">Ayo</a> and <a
            href="https://www.instagram.com/aaaaaaaaaxiuan/" target="_blank">Axuan</a>.
    </footer>
    <extra></extra>
</body>

<script>
    let detailData = null;

    // 取得本地json(測試資料)
    const LoadLocalJson = (filePath) => {
        $.getJSON(filePath, (json) => {
            window.postMessage({ type: "record", payload: json }, '*');
        });
    };

    // 接到message事件(從maimai-net收到資料)
    $(window).on('message', (event) => {
        $('.test').addClass('d-none');
        const data = event.originalEvent.data;
        if (data.type === 'init') {
            $('#msg').text('連線中，請勿關閉maimai-net...曲數較多請耐心等候...');
        }
        else if (data.type === 'record') {
            $('.result-container').removeClass('d-none');
            $('#div-msg').addClass('d-none');
            const recordData = data.payload;

            // R值折線圖            
            const filteredData = recordData.filter((item, index, arr) => index === recordData.length - 1 || (arr[index + 1] != null && item.rating !== arr[index + 1].rating));
            const labels = filteredData.map((song, i) => `${song.no}.${song.difficulty} : ${song.title} ${song.rating_plus}`);
            const ratings = filteredData.map(song => parseInt(song.rating, 10));
            const pointColors = ratings.map((_, i) => i === 0 ? 'white' : '#0b4670');
            const ctx = document.getElementById('rating-chart').getContext('2d');

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Rating',
                        data: ratings,
                        borderColor: '#0b4670',
                        backgroundColor: '#0b4670',
                        fill: false,
                        tension: 0,
                        borderWidth: 1,
                        pointRadius: 3,
                        pointBackgroundColor: pointColors,
                        pointBorderColor: '#0b4670',
                        pointBorderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    layout: {
                        padding: {
                            right: 60,
                            top: 40,
                            bottom: 40,
                        }
                    },
                    scales: {
                        x: {
                            ticks: { display: false },
                            grid: { display: false },
                            reverse: true,
                        },
                        y: {
                            beginAtZero: false,
                            ticks: {
                                stepSize: 500,
                                callback: (value) => value.toLocaleString(),
                                color: '#203844',
                                font: {
                                    size: 12
                                },
                                padding: 15,
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        },
                        datalabels: {
                            formatter: (value, ctx) => {
                                return value.toLocaleString();
                            },
                            color: (ctx) => ctx.dataIndex === 0 ? 'red' : '#0b4670',
                            align: (ctx) => ctx.dataIndex === 0 ? 'right' : 'bottom',
                            offset: 2,
                            font: {
                                size: 12
                            },
                        },
                        annotation: {
                            annotations: {
                                line1: {
                                    type: 'line',
                                    yMin: ratings[0],
                                    yMax: ratings[0],
                                    borderColor: 'red',
                                    borderWidth: 1,
                                    drawTime: 'beforeDatasetsDraw'
                                }
                            }
                        }
                    }
                },
                plugins: [ChartDataLabels]
            });
            Chart.defaults.color = '#203844';
            ctx.canvas.style.backgroundColor = '#ffffff';


            // 歌曲詳細資料
            const $container = $("#song-list");

            $.each(recordData, function (_, song) {
                let notesTable = `
                <table class="mb-2">
                    <thead class="table-light">
                        <tr>
                            <th>Type</th>
                            <th>Critical Perfect</th>
                            <th>Perfect</th>
                            <th>Great</th>
                            <th>Good</th>
                            <th>Miss</th>
                        </tr>
                    </thead>
                    <tbody>
                `;

                $.each(song.notes, function (type, vals) {
                    notesTable += `
                    <tr>
                        <td>${type.charAt(0).toUpperCase() + type.slice(1)}</td>
                        <td>${vals.critical_perfect}</td>
                        <td>${vals.perfect}</td>
                        <td>${vals.great}</td>
                        <td>${vals.good}</td>
                        <td>${vals.miss}</td>
                    </tr>
                `;
                });

                notesTable += `</tbody></table>`;

                $container.append(`
                    <div class="col-2">
                        <div class="">
                        <img src="${song.image}" class="card-img-top" alt="${song.title}">
                        <div class="">
                            <h5 class="">${song.title}</h5>
                            <p class=""><strong>Score:</strong> ${song.score}</p>
                            <p class=""><strong>DX Score:</strong> ${song.dx_score}</p>
                            <p class=""><strong>FAST:</strong> ${song.fast} | <strong>LATE:</strong> ${song.late}</p>
                            <p class=""><strong>Rating:</strong> ${song.rating} ${song.rating_plus}</p>
                            ${notesTable}
                            <p class=""><strong>Max Combo:</strong> ${song.max_combo}</p>
                            <p class=""><strong>Max Sync:</strong> ${song.max_sync}</p>
                        </div>
                        </div>
                    </div>
                `);
            });


            // 顯示歌曲紀錄清單
            recordData.forEach((song, index) => {
                $("#song-table").append(`
                    <tr class="tr-${song.difficulty}">
                        <td><img src="${song.image}" width="50"></td>
                        <td>${song.title}</td>
                        <td>${song.score}</td>
                        <td>${song.dx_score}</td>
                        <td><button class="toggle-detail" data-id="${index}">詳細</button></td>
                    </tr>
                    <tr class="detail-row" id="detail-${index}" style="display:none;">
                        <td colspan="5" style="background:#f9f9f9;">
                            ${renderRecordDetails(song)}
                        </td>
                    </tr>
                `);
            });

            $(document).on("click", ".toggle-detail", function () {
                const id = $(this).data("id");
                $(`#detail-${id}`).toggle();
            });
        }
    });

    //顯示詳細記錄
    const renderRecordDetails = (song) => {
        return `
            <div>
                <p>FAST: ${song.fast} | LATE: ${song.late}</p>
                <p>Rating: ${song.rating} ${song.rating_plus}</p>
                <table class="detail-table">
                <thead>
                    <tr>
                    <th>類型</th>
                    <th>Critical Perfect</th>
                    <th>Perfect</th>
                    <th>Great</th>
                    <th>Good</th>
                    <th>Miss</th>
                    </tr>
                </thead>
                <tbody>
                    ${Object.entries(song.notes).map(([type, stats]) => `
                    <tr>
                        <td>${type}</td>
                        <td>${stats.critical_perfect}</td>
                        <td>${stats.perfect}</td>
                        <td>${stats.great}</td>
                        <td>${stats.good}</td>
                        <td>${stats.miss}</td>
                    </tr>
                    `).join('')}
                </tbody>
                </table>
                <p>Max Combo: ${song.max_combo} | Max Sync: ${song.max_sync}</p>
            </div>
        `;
    }
</script>
<style>
    #div-rating-chart {
        background: #203844;
        padding: 20px;
        padding-top: 10px;
        border-radius: 20px;
        border: 1px solid #ffffff;
    }

    #rating-chart-title {
        color: #ffffff;
        padding-top: 10px;
    }

    .heavy-hr {
        background: #fcd810;
        width: 100%;
        height: 10px;
    }

    .tr-advanced {
        background: #f8b709;
    }

    .tr-basic {
        background: #81d955;
    }

    .tr-count {
        display: block;
        text-align: left;
    }

    .tr-expert {
        background: #ff818d;
    }

    .tr-master {
        background: #c346e7;
    }

    .tr-remaster {
        background: #fff;
    }


    .table-wrapper {
        margin: 10px 70px 70px;
        box-shadow: 0px 35px 50px rgba(0, 0, 0, 0.2);
    }

    #song-table {
        border-collapse: collapse;
        border: 1px solid black;
    }

    #song-table th {
        border: none;
        background-color: black;
        color: white;
        font-weight: bold;
    }

    #song-table td {
        border: none;
    }

    #song-table tr {
        border-bottom: 1px solid black;
    }

    #song-table tr:last-child {
        border-bottom: none;
    }
</style>
