<!DOCTYPE html>

<svg width="0" height="0">
    <filter id="crayon-effect">
        <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G" />

</head>

<body>
    <div class="main mb-5">
        <div id="div-msg" class="col-12 d-flex align-items-center my-3">
            <div class="section-divider left"></div>
            <b id="msg" class="px-3 section-divider-title">如果看到這行字超過5秒，代表資料沒傳成功，請回maimai-net重整後再試一次</b>
            <div class="section-divider right"></div>
        </div>
        <button id="test1" class="test d-none" onclick="LoadLocalJson('json/test_data/test_data_record.json')">測試資料1</button>
        <button id="beta" class="d-none" onclick="GoToBeta()">新版頁面(beta版)</button>
        <div id="result-container" class="my-4 d-none">
            <div id="div-rating-chart" class="mb-4">
                <div id="rating-chart-title" class="text-center mb-3">
                    <h5>近50首Rating變化</h5>
                </div>
                <div class="heavy-hr"></div>
                <canvas id="rating-chart" height="100" class="my-4"></canvas>
                <div class="heavy-hr"></div>
            </div>
            <div id="filters" class="d-flex justify-content-center mb-3">
                <div id="date-button-group"></div>
            </div>
            <div id="filters" class="d-flex justify-content-center mb-3">
                <input type="checkbox" id="btn-new-record" class="ms-2" onclick="showSongRecord()">
                <label for="btn-new-record">只顯示新記錄</label>
                <input type="checkbox" id="btn-highest-score" class="ms-2" onclick="showSongRecord()">
                <label for="btn-highest-score">只顯示最高分</label>
                <input type="checkbox" id="btn-new-dx-record" class="ms-2" onclick="showSongRecord()">
                <label for="btn-new-dx-record">只顯示DX新記錄</label>
            </div>
            <div class="d-flex justify-content-center mb-3">
                <span class="me-2 align-self-center">詳細資料：</span>
                <button class="me-2" onclick="uncollapseAllDetails()" value="展開全部">展開全部</button>
                <button onclick="collapseAllDetails()">收合全部</button>
            </div>
            <table id="song-table" class="text-center w-100">
                <thead>
                    <tr>
                        <th>封面</th>
                        <th>定數</th>
                        <th class="text-start">曲名</th>
                        <th>成績</th>
                        <th>DX成績</th>
                        <th>遊玩時間</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>

                </tbody>
            </table>
        </div>
    </div>
    <footer class="text-center">
        <hr>
        Made by <a href="https://github.com/tsukiyo10884/" target="_blank">Tsukiyo</a>, in collaboration with <a
            href="https://www.instagram.com/mua_2110/" target="_blank">Ayo</a> and <a
            href="https://www.instagram.com/aaaaaaaaaxiuan/" target="_blank">Axuan</a>.
    </footer>
    <div class="extra-credits"></div>
</body>

<script>
    let detailData = null;
    let recordData = [];

    // 取得本地json(測試資料)
    const LoadLocalJson = (filePath) => {
        $.getJSON(filePath, (json) => {
            window.postMessage({ type: "record", payload: json }, '*');
        });
    };

    // 接到message事件(從maimai-net收到資料)
    $(window).on('message', async (event) => {
        $('.test').addClass('d-none');
        const data = event.originalEvent.data;
        if (data.type === 'init') {
            $('#msg').text('連線中，請勿關閉maimai-net...曲數較多請耐心等候...');
        }
        else if (data.type === 'record') {
            $('#result-container').removeClass('d-none');
            $('#div-msg').addClass('d-none');
            recordData = data.payload;
            let dates = [...new Set(recordData.map(song => song.date.substring(0, 10)))];
            dates.sort((a, b) => new Date(b) - new Date(a));
            createDateButtons(dates);
            await showRatingChart();
            showSongRecord();
            $('#beta').removeClass('d-none');
        }
    });

    const GoToBeta = () => {
        const siteOrigin = document.location.origin;
        const childWin = window.open(`${siteOrigin}/mai-tools/record_beta.html`);
        setTimeout(() => {

            childWin.postMessage({ type: "record", payload: recordData }, siteOrigin);
        }, 1000);
    }
</script>
