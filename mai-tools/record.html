<!DOCTYPE html>
<html lang="zh-TW">
<svg width="0" height="0">
    <filter id="crayon-effect">
        <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G" />
    </filter>
</svg>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=915">
    <link rel="icon" href="img/favicon.ico">
    <title>maimai小工具</title>
    <link id="theme" rel="stylesheet" href="css/default.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3"></script>
    <script src="js/common.js"></script>
    <script src="js/others/record.js"></script>

</head>

<body>
    <div class="main mb-5">
        <h3>施工中</h3>
        <div id="div-msg" class="col-12 d-flex align-items-center my-3">
            <div class="section-divider left"></div>
            <b id="msg" class="px-3 section-divider-title">如果你看到這行字超過5秒，代表資料沒傳成功，請回maimai-net重整後再試一次</b>
            <div class="section-divider right"></div>
        </div>
        <button id="test1" class="test" onclick="LoadLocalJson('json/test_data/test_data_record.json')">測試資料1</button>
        <div class="result-container my-4 d-none">
            <div id="div-rating-chart" class="mb-4">
                <div id="rating-chart-title" class="text-center mb-3">
                    <h5>近50首Rating變化</h5>
                </div>
                <div class="heavy-hr"></div>
                <canvas id="rating-chart" height="100" class="my-4"></canvas>
                <div class="heavy-hr"></div>
            </div>
            <table id="song-table" class="text-center w-100">
                <thead>
                    <tr>
                        <th>封面</th>
                        <th>定數</th>
                        <th class="text-start">曲名</th>
                        <th>成績</th>
                        <th>DX成績</th>
                        <th>遊玩時間</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>

                </tbody>
            </table>
        </div>
    </div>
    <footer class="text-center">
        <hr>
        Made by <a href="https://github.com/tsukiyo10884/" target="_blank">Tsukiyo</a>, in collaboration with <a
            href="https://www.instagram.com/mua_2110/" target="_blank">Ayo</a> and <a
            href="https://www.instagram.com/aaaaaaaaaxiuan/" target="_blank">Axuan</a>.
    </footer>
    <div class="extra-credits"></div>
</body>

<script>
    let detailData = null;

    // 取得本地json(測試資料)
    const LoadLocalJson = (filePath) => {
        $.getJSON(filePath, (json) => {
            window.postMessage({ type: "record", payload: json }, '*');
        });
    };

    // 接到message事件(從maimai-net收到資料)
    $(window).on('message', (event) => {
        $('.test').addClass('d-none');
        const data = event.originalEvent.data;
        if (data.type === 'init') {
            $('#msg').text('連線中，請勿關閉maimai-net...曲數較多請耐心等候...');
        }
        else if (data.type === 'record') {
            $('.result-container').removeClass('d-none');
            $('#div-msg').addClass('d-none');
            const recordData = data.payload;
            showRatingChart(recordData);
            showSongRecord(recordData);
        }
    });

</script>
