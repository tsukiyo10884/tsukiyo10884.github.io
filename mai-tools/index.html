    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import {
            getFirestore,
            collection,
            addDoc,
            deleteDoc,
            query,
            where,
            getDocs,
            orderBy,
            Timestamp,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCLc_eSevQS1UvxSrP7smqMDMX7vpRqwY",
            authDomain: "mai-tools-1f4ac.firebaseapp.com",
            projectId: "mai-tools-1f4ac",
            storageBucket: "mai-tools-1f4ac.firebasestorage.app",
            messagingSenderId: "798518415925",
            appId: "1:798518415925:web:19073fbcc79a2e0e89d77c",
            measurementId: "G-P2S8Z05HCF"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function uploadRating(userId, score, recordDate) {
            try {
                const colRef = collection(db, "ratings");
                const docRef = await addDoc(colRef, {
                    id: userId,
                    rating: score,
                    record_date: Timestamp.fromDate(new Date(recordDate)) || serverTimestamp()
                });
            } catch (e) {
                console.error("Error uploading rating: ", e);
            }
        }

        async function deleteRating(userId, recordDate) {
            try {
                const colRef = collection(db, "ratings");
                const q = query(
                    colRef,
                    where("id", "==", userId),
                    where("record_date", "==", Timestamp.fromDate(new Date(recordDate)))
                );

                const querySnapshot = await getDocs(q);

                const deletePromises = [];
                querySnapshot.forEach((doc) => {
                    deletePromises.push(deleteDoc(doc.ref));
                });

                await Promise.all(deletePromises);
            } catch (e) {
                console.error("Error deleting rating: ", e);
            }
        }

        async function getUserHistory(userId) {
            try {
                const colRef = collection(db, "ratings");

                const q = query(
                    colRef,
                    where("id", "==", userId),
                    orderBy("record_date", "asc")
                );

                const querySnapshot = await getDocs(q);

                let history = [];
                querySnapshot.forEach((doc) => {
                    history.push({
                        id: doc.data().id,
                        rating: doc.data().rating,
                        record_date: doc.data().record_date.toDate()
                    });
                });

                if (history.length > 50) {
                    const excessEntries = history.length - 50;
                    for (let i = 0; i < excessEntries; i++) {
                        await deleteRating(userId, history[i].record_date);
                    }
                }
                return history;
            } catch (e) {
                console.error("Error getting user history: ", e);
            }
        }

        window.fbTools = { uploadRating, deleteRating, getUserHistory };
    </script>
    <script>
        let versionList = [];
        let versionOrder = [];
        let generalData = "";
        let courseData = "";
        let currentVersion = "";
        let currentVersionJP = "";
        let currentVersionIntl = "";

        const init = async () => {
            versionList = await $.getJSON('json/version.json');

            const today = new Date().toISOString().split('T')[0];
            const jpVersions = versionList.filter(v => v.startDateJP && v.startDateJP <= today);
            currentVersionJP = jpVersions.length > 0 ? jpVersions[jpVersions.length - 1].versionName : "PRiSM PLUS";

            const intlVersions = versionList.filter(v => v.startDateIntl && v.startDateIntl <= today);
            currentVersionIntl = intlVersions.length > 0 ? intlVersions[intlVersions.length - 1].versionName : "BUDDiES PLUS";

            updateCurrentVersion();
            versionOrder = [...new Set(
                versionList
                    .map(v => v.versionName)
                    .filter(name => !name.includes('~'))
            )];
            initPalette();
            $('#version-switch').on('change', () => {
                updateCurrentVersion();
                handleFilterChange();
            });
            setupEventListeners();
        };

        const setupEventListeners = () => {
            bindCompletionEventListeners();
            bindPlayedEventListeners();

            $(window).on('load', () => {
                $('#json-data').text() && refreshData();
            });
        };

        // 接到message事件(從maimai-net收到資料)
        $(window).on('message', (event) => {
            $('#test').addClass('d-none');
            $('#test2').addClass('d-none');
            const messageData = event.originalEvent.data;
            if (!messageData || typeof messageData !== "object") return;

            const $output = $('#output');
            switch (messageData.type) {
                case "init": {
                    $('#btn-import').addClass("d-none");
                    $output.html(`取得成績中，請勿關閉maimai-net`);
                    if (messageData.payload != null) {
                        if (cssFiles.includes('css/' + messageData.payload + '.css')) {
                            $('#theme').attr('href', 'css/' + messageData.payload + '.css');
                            $('#palette').attr('title', messageData.payload);
                        } else {
                            $('#theme').attr('href', 'css/default.css');
                            $('#palette').attr('title', 'default');
                        }
                    }
                    break;
                }
                case "difficulty": {
                    if (!$('#btn-import').hasClass("d-none")) {
                        $('#btn-import').addClass("d-none");
                    }
                    $output.html(`取得成績中(${messageData.payload})，請勿關閉maimai-net`);
                    break;
                }
                case "course": {
                    $output.html(`取得成績中(段位認定)，請勿關閉maimai-net`);
                    break;
                }
                case "circle": {
                    $output.html(`取得Circle資料中，請勿關閉maimai-net`);
                    break;
                }
                case "result": {
                    $output.html(`<textarea id="json-data" class="d-none">${JSON.stringify(messageData.payload, null, 2)}</textarea>`);
                    refreshData();
                    break;
                }
                case "result-friend": {
                    $('#self').addClass("d-none");
                    $output.html(`<textarea id="json-data" class="d-none">${JSON.stringify(messageData.payload, null, 2)}</textarea>`);
                    refreshData();
                    break;
                }
                case "jp": {
                    if (messageData.payload) {
                        $('#version-switch').prop('checked', true);
                    }
                    break;
                }
                case "special": {
                    if (messageData.payload === 'ayo') {
                        $('#stat').html(`<div class="d-flex align-items-center"><p>恭喜橙堇將！啊你的星神、祭白雪熊將呢</p></div>`);
                    }
                    else if (messageData.payload === 'axun') {
                        $('#stat').html(`<div class="d-flex align-items-center"><p>你的超怪呢</p></div>`);
                    }
                    break;
                }
                case "ratingHistory": {
                    generalData.ratingHistory = messageData.payload
                    break;
                }
            }
        });

        // 取得本地json(測試資料)
        const LoadLocalJson = (filePath) => {
            $('#div-test').addClass('d-none');
            window.postMessage({ type: 'init', payload: null }, '*');
            $.getJSON(filePath, (json) => {
                $('#output').html(`<textarea id="json-data" class="d-none">${JSON.stringify(json, null, 2)}</textarea>`);
                refreshData();
            });
        };

        const updateCurrentVersion = () => {
            if ($('#version-switch').is(':checked')) {
                currentVersion = currentVersionJP;
            } else {
                currentVersion = currentVersionIntl;
            }
        };

        const refreshData = async () => {
            generalData = JSON.parse($('#json-data').text());
            generalData.ratingRecord = undefined;
            fbTools.getUserHistory(generalData.userInfo.id).then(result => {
                generalData.ratingRecord = result ?? null;
                if ($('#now-title').text() === 'overview') {
                    showTable('overview');
                }
            }).catch(err => {
                console.error(err);
                generalData.ratingRecord = null;
            });;

            if (generalData.course == null) {
                $('#btn-course').addClass('d-none');
            }

            const topSongs = getTop50Songs();
            generalData.ratingSongList = {
                rating_new: songFilter(topSongs, { isNewVersion: true }),
                rating_others: songFilter(topSongs, { isNewVersion: false })
            };

            initUserInfo();
            $('#div-button-group').removeClass('d-none');
        };

        $(init);

    </script>
