    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import {
            getFirestore,
            collection,
            addDoc,
            query,
            where,
            getDocs,
            orderBy,
            Timestamp,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCLc_eSevQS1UvxSrP7smqMDMX7vpRqwY",
            authDomain: "mai-tools-1f4ac.firebaseapp.com",
            projectId: "mai-tools-1f4ac",
            storageBucket: "mai-tools-1f4ac.firebasestorage.app",
            messagingSenderId: "798518415925",
            appId: "1:798518415925:web:19073fbcc79a2e0e89d77c",
            measurementId: "G-P2S8Z05HCF"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function uploadRating(userId, score, recordDate) {
            try {
                const colRef = collection(db, "ratings");
                const docRef = await addDoc(colRef, {
                    id: userId,
                    rating: score,
                    record_date: Timestamp.fromDate(new Date(recordDate)) || serverTimestamp()
                });
            } catch (e) {
                console.error("Error uploading rating: ", e);
            }
        }

        async function getUserHistory(userId) {
            try {
                const colRef = collection(db, "ratings");

                const q = query(
                    colRef,
                    where("id", "==", userId),
                    orderBy("record_date", "asc")
                );

                const querySnapshot = await getDocs(q);

                let history = [];
                querySnapshot.forEach((doc) => {
                    history.push({
                        id: doc.data().id,
                        rating: doc.data().rating,
                        record_date: doc.data().record_date.toDate()
                    });
                });

                return history;
            } catch (e) {
                console.error("Error getting user history: ", e);
            }
        }

        window.fbTools = { uploadRating, getUserHistory };
    </script>
    <script>

        let versionList = [];

        let versionOrder = [];
        let data = "";
        let courseData = "";
        let currentVersion = "";
        let currentVersionJP = "";
        let currentVersionIntl = "";

        const init = async () => {
            versionList = await $.getJSON('json/version.json');

            const today = new Date().toISOString().split('T')[0];
            const jpVersions = versionList.filter(v => v.startDateJP && v.startDateJP <= today);
            currentVersionJP = jpVersions.length > 0 ? jpVersions[jpVersions.length - 1].versionName : "PRiSM PLUS";

            const intlVersions = versionList.filter(v => v.startDateIntl && v.startDateIntl <= today);
            currentVersionIntl = intlVersions.length > 0 ? intlVersions[intlVersions.length - 1].versionName : "BUDDiES PLUS";

            updateCurrentVersion();
            versionOrder = [...new Set(
                versionList
                    .map(v => v.versionName)
                    .filter(name => !name.includes('~'))
            )];
            initPalette();
            $('#version-switch').on('change', () => {
                updateCurrentVersion();
                handleFilterChange();
            });
            setupEventListeners();
        };

        const setupEventListeners = () => {
            bindCompletionEventListeners();
            bindPlayedEventListeners();

            $(window).on('load', () => {
                $('#json-data').text() && refreshData();
            });
        };

        // 接到message事件(從maimai-net收到資料)
        $(window).on('message', (event) => {
            $('#test').addClass('d-none');
            $('#test2').addClass('d-none');
            const data = event.originalEvent.data;
            if (!data || typeof data !== "object") return;

            const $output = $('#output');
            switch (data.type) {
                case "init": {
                    $('#btn-import').addClass("d-none");
                    $output.html(`取得成績中，請勿關閉maimai-net`);
                    if (data.payload != null) {
                        if (cssFiles.includes('css/' + data.payload + '.css')) {
                            $('#theme').attr('href', 'css/' + data.payload + '.css');
                            $('#palette').attr('title', data.payload);
                        } else {
                            $('#theme').attr('href', 'css/default.css');
                            $('#palette').attr('title', 'default');
                        }
                    }
                    break;
                }
                case "difficulty": {
                    $output.html(`取得成績中(${data.payload})，請勿關閉maimai-net`);
                    break;
                }
                case "course": {
                    $output.html(`取得成績中(段位認定)，請勿關閉maimai-net`);
                    break;
                }
                case "result": {
                    $output.html(`<textarea id="json-data" class="d-none">${JSON.stringify(data.payload, null, 2)}</textarea>`);
                    refreshData();
                    break;
                }
                case "result-friend":{
                    $('#self').addClass("d-none");
                    $output.html(`<textarea id="json-data" class="d-none">${JSON.stringify(data.payload, null, 2)}</textarea>`);
                    refreshData();
                }
                case "jp": {
                    if (data.payload) {
                        $('#version-switch').prop('checked', true);
                    }
                    break;
                }
                case "special": {
                    if (data.payload === 'ayo') {
                        $('#stat').html(`<div class="d-flex align-items-center"><p>恭喜橙堇將！啊你的星神、祭白雪熊將呢</p></div>`);
                    }
                    else if (data.payload === 'axun') {
                        $('#stat').html(`<div class="d-flex align-items-center"><p>你的超怪呢</p></div>`);
                    }
                }
            }
        });

        // 取得本地json(測試資料)
        const LoadLocalJson = (filePath) => {
            $('#div-test').addClass('d-none');
            window.postMessage({ type: 'init', payload: null }, '*');
            $.getJSON(filePath, (json) => {
                $('#output').html(`<textarea id="json-data" class="d-none">${JSON.stringify(json, null, 2)}</textarea>`);
                refreshData();
            });
        };

        const updateCurrentVersion = () => {
            if ($('#version-switch').is(':checked')) {
                currentVersion = currentVersionJP;
            } else {
                currentVersion = currentVersionIntl;
            }
        };

        const refreshData = async () => {
            data = JSON.parse($('#json-data').text());
            data.ratingRecord = await fbTools.getUserHistory(data.userInfo.id);

            if (data.course == null) {
                $('#btn-course').addClass('d-none');
            }

            const topSongs = getTop50Songs();
            data.ratingSongList = {
                rating_new: songFilter(topSongs, { isNewVersion: true }),
                rating_others: songFilter(topSongs, { isNewVersion: false })
            };

            initUserInfo();
            $('#div-button-group').removeClass('d-none');
        };

        const uploadRating = async () => {
            if (data.ratingHistory == null || data.ratingHistory.length === 0) {
                alert("沒有R值歷史紀錄，無法上傳");
                return;
            }
            if (!confirm("上傳後紀錄為公開資料，確定繼續嗎？")) {
                return;
            }

            const existingHistory = await fbTools.getUserHistory(data.userInfo.id);
            let proposedData = data.ratingHistory.filter(r => {
                return !existingHistory.some(e => e.rating === r.rating);
            });

            for (const r of proposedData) {
                await fbTools.uploadRating(data.userInfo.id, r.rating, r.record_date);
            }
            refreshData();
            alert("資料已更新");
        };

        const triggerImport = () => {
            $('#input-file').click();
        }
        const importData = (file) => {
            // 驗證檔案類型為JSON
            if (file.files[0].type !== "application/json") {
                alert("請上傳JSON格式的檔案");
                return;
            }
            $('#div-test').addClass('d-none');
            window.postMessage({ type: 'init', payload: null }, '*');
            const reader = new FileReader();
            reader.onload = (e) => {
                const content = e.target.result;
                $('#output').html(`<textarea id="json-data" class="d-none">${content}</textarea>`);
                refreshData();
            };
            reader.readAsText(file.files[0]);
        }

        const exportData = () => {
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `maimai-data-${data.userInfo.name}-${new Date().toLocaleString().replace(/[/:\s]/g, '-')}.json`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        $(init);

    </script>
