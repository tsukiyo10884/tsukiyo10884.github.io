<!DOCTYPE html>
<html lang="zh-TW">
<svg width="0" height="0">
    <filter id="crayon-effect">
        <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G" />
    </filter>
</svg>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=915">
    <link rel="icon" href="img/favicon.ico">
    <title>maimai小工具</title>
    <link id="theme" rel="stylesheet" href="css/default.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="https://sgimera.github.io/mai_RatingAnalyzer/scripts_maimai/maidx_calc_sub.js"></script>
    <script src="https://sgimera.github.io/mai_RatingAnalyzer/scripts_maimai/maidx_calc_rating.js"></script>
    <script src="js/common.js"></script>
    <script src="js/main_feature/rating.js"></script>
    <script src="js/main_feature/suggestion.js"></script>
    <script src="js/main_feature/plate.js"></script>
    <script src="js/main_feature/level.js"></script>
    <script src="js/main_feature/course.js"></script>
    <script src="js/main_feature/special.js"></script>
    <script src="js/main_feature/for_axuan.js"></script>
    <script src="js/main_feature/for_ayo.js"></script>
</head>

<body>
    <div>
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
    </div>
    <div class="main mb-5">

        <div id="info" class="row justify-content-start ms-1">

            <!-- From Uiverse.io by Bodyhc -->
            <div class="checkbox-wrapper-35 p-0">
                <input value="private" name="switch" id="version-switch" type="checkbox" class="switch">
                <label for="version-switch" style="width: fit-content;">
                    <span class="switch-x-text">歌曲版本：</span>
                    <span class="switch-x-toggletext">
                        <span class="switch-x-unchecked"><span class="switch-x-hiddenlabel">Unchecked:
                            </span>International
                            Ver.</span>
                        <span class="switch-x-checked"><span class="switch-x-hiddenlabel">Checked: </span>Japanese
                            Ver.</span>
                    </span>
                </label>
            </div>

            <p class="f_14 p_0" style="width: fit-content;">譜面定數： <a
                    href="https://arcade-songs.zetaraku.dev/maimai/about/" target="_blank">arcade-songs</a></p>
            <p class="f_14 p_0" style="width: fit-content;">　|　刪除曲：
                <a href="https://maimai.fandom.com/zh/wiki/%E5%88%AA%E9%99%A4%E6%9B%B2%E4%B8%80%E8%A6%BD"
                    target="_blank">maimai中文維基</a>
            </p>
            <p class="f_14 p_0" style="width: fit-content;">　|　rating計算方法： <a
                    href="https://sgimera.github.io/mai_RatingAnalyzer/maidx_calc.html" target="_blank">sgimera</a>
            </p>
            <div class="col">
            </div>
            <div class="col-1">
                <img id="palette" src="img/palette.svg">
            </div>
        </div>
        <button id="test" onclick="LoadLocalJson('json/test_data/test_data.json')">測試資料1</button>
        <button id="test2" onclick="LoadLocalJson('json/test_data/test_data2.json')">測試資料2</button>
        <div id="output"></div>
        <textarea id="now-title" class="d-none"></textarea>
        <div id="button-group" class="row d-none align-items-center">
            <div class="col-2">
                <button id="btn-rating" class="w-100" onclick="showTable('rating')">R値入選曲</button>
            </div>
            <div class="col-2">
                <button id="btn-suggestion" class="w-100" onclick="showTable('suggestion')">R値候選曲</button>
            </div>
            <div class="col-2">
                <button id="btn-plate" class="w-100" onclick="showTable('plate')">名牌版進度</button>
            </div>
            <div class="col-2">
                <button id="btn-level" class="w-100" onclick="showTable('level')">等級進度</button>
            </div>
            <div class="col-2">
                <button id="btn-course" class="w-100" onclick="showTable('course')">段位認定</button>
            </div>
            <div id="completion-filters" class="col-2 d-none">
                <div class="checkbox-group">
                    <input type="checkbox" id="completed-only" name="completion-filter" class="form-check-input">
                    <label for="completed-only">只顯示已達成</label>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="non-completed-only" name="completion-filter" class="form-check-input">
                    <label for="non-completed-only">只顯示未達成</label>
                </div>
            </div>
            <div id="play-filters" class="col-2 d-none">
                <div class="checkbox-group">
                    <input type="checkbox" id="played-only" name="play-filter" class="form-check-input">
                    <label for="completed-only">只顯示已玩過</label>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="non-played-only" name="play-filter" class="form-check-input">
                    <label for="non-completed-only">只顯示未玩過</label>
                </div>
            </div>
        </div>
        <div class="result-container">
            <div class="row border-bottom border-secondary">
                <div id="user-info" class="user-info col-6 d-none">
                </div>
                <div id="stat" class="col-6 row"></div>
            </div>
            <div id="song-table" class="ms-1 mt-1"></div>
        </div>
        <footer class="text-center">
            <hr>
            <p id="credit">
                Made by <a href="https://github.com/tsukiyo10884/" target="_blank">Tsukiyo</a>, in
                collaboration with <a href="https://www.instagram.com/mua_2110/" target="_blank">Ayo</a> and <a
                    href="https://www.instagram.com/aaaaaaaaaxiuan/" target="_blank">Axuan</a>
                ; inspired by <a href="https://github.com/myjian/">Ming-yuen Jien</a>.</p>
        </footer>
    </div>

    <script>
        let versionList = [];
        let versionOrder = [];
        let data = "";
        let courseData = "";
        let currentVersion = "PRiSM PLUS";

        const init = async () => {
            versionList = await $.getJSON('json/version.json');
            versionOrder = [...new Set(
                versionList
                    .map(v => v.versionName)
                    .filter(name => !name.includes('~'))
            )];
            initPalette();
            $('#version-switch').on('change', () => {
                handleFilterChange();
            });
        };

        const setupEventListeners = () => {
            bindCompletionEventListeners();
            bindPlayedEventListeners();

            $(window).on('load', () => {
                $('#json-data').text() && refreshData();
            });
        };

        // 接到message事件(從maimai-net收到資料)
        $(window).on('message', (event) => {
            $('#test').addClass('d-none');
            $('#test2').addClass('d-none');
            const data = event.originalEvent.data;
            if (!data || typeof data !== "object") return;

            const $output = $('#output');
            switch (data.type) {
                case "init": {
                    $output.html(`取得成績中，請勿關閉maimai-net`);
                    if (data.payload != null) {
                        if (cssFiles.includes('css/' + data.payload + '.css')) {
                            $('#theme').attr('href', 'css/' + data.payload + '.css');
                            $('#palette').attr('title', data.payload);
                        } else {
                            $('#theme').attr('href', 'css/default.css');
                            $('#palette').attr('title', 'default');
                        }
                    }
                    break;
                }
                case "difficulty": {
                    $output.html(`取得成績中(${data.payload})，請勿關閉maimai-net`);
                    break;
                }
                case "course": {
                    $output.html(`取得成績中(段位認定)，請勿關閉maimai-net`);
                    break;
                }
                case "result": {
                    $output.html(`<textarea id="json-data" class="d-none">${JSON.stringify(data.payload, null, 2)}</textarea>`);
                    $('#button-group').removeClass('d-none');
                    refreshData();
                    break;
                }
                case "jp": {
                    if (data.payload) {
                        $('#version-switch').prop('checked', true);
                    }
                    break;
                }
                case "special": {
                    if (data.payload === 'ayo') {
                        $('#stat').html(`<div class="d-flex align-items-center"><p>你的星將、白將、祭將、熊將呢</p></div>`);
                    }
                    else if (data.payload === 'axun') {
                        $('#stat').html(`<div class="d-flex align-items-center"><p>你的超怪呢</p></div>`);
                    }
                }
            }
        });

        // 取得本地json(測試資料)
        const LoadLocalJson = (filePath) => {
            window.postMessage({ type: 'init', payload: null }, '*');
            $.getJSON(filePath, (json) => {
                $('#button-group').removeClass('d-none');
                $('#test').addClass('d-none');
                $('#test2').addClass('d-none');
                $('#output').html(`<textarea id="json-data" class="d-none">${JSON.stringify(json, null, 2)}</textarea>`);
                refreshData();
            });
        };

        const refreshData = () => {
            data = JSON.parse($('#json-data').text());

            if (data.course == null) {
                $('#btn-course').addClass('d-none');
            }
            initUserInfo();
        };

        $(init);
    </script>
    <style>
        .p_0 {
            padding: 0 !important;
        }

        #palette {
            cursor: pointer;
            height: 30px !important;
            z-index: 1000;
        }

        .main {
            --bs-gutter-x: 1.5rem;
            --bs-gutter-y: 0;
            margin-left: auto;
            margin-right: auto;
            padding-left: calc(var(--bs-gutter-x) * .5);
            padding-right: calc(var(--bs-gutter-x) * .5);
            width: 915px;
        }

        body {
            overflow-y: scroll;
        }
    </style>
</body>

</html>
